[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uliflow"
version = "0.1.0"
description = "Unified latent flow for text-conditioned human-object interaction generation."
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==0.34.2",
  "numpy==2.2.6",
  "PyYAML==6.0.3",
  "torch==2.7.1",
  "transformers==4.57.6",
  "wandb==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
